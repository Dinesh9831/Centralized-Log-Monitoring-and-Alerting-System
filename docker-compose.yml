version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: log-monitor-backend
    ports:
      - "5000:5000"
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=prod

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: log-monitor-frontend
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      - backend
